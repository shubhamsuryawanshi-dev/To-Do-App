<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>My Todos</h1>

        <div class="main">
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" maxlength="200">
            <button id="add-btn" aria-label="Add todo">Add</button>
        </div>

        <ul id="todo-list"></ul>

        <p id="empty-state" class="empty-state">Nothing here yet — add your first todo above ✨</p>

        <div class="footer">
            <span id="items-left">0 items left</span>

            <div class="filters" role="tablist">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <button id="clear-completed">Clear done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
